<!DOCTYPE html>
<html>
    <head>
        <title>
            My super hero card
        </title>
        <style>
            /* typography-font size,weight,color of the whole page */
            body{
                background-color: darkblue;
                color:white;
                font:arial,Sans-serif;


            }
            /* Typography-big bold title with an orange shadow*/
            .hero-name{
                font-size:60px;
                font-weight:bold;
                color:yellow;
                text-shadow:3px 3px orange ;
            }
            /* Typography+text transform-Tagline becomes title case*/
            .tagline{
                font-style:italic;
                color:lightblue;
                text-transform:capitalize;


            }
            /*text transform + text decoration - section headings with CAPS with underline*/
            .label{
                text-transform:uppercase;
                text-decoration:underline;
                color:coral;

            }
            /*typography-Powers stand out in bold green*/
            .power{
                font-weight:bold;
                color:light green;
            }
            /*text decorations-weakness are crossed out*/
            .weakness{
                text-decoration:line-through;
                color:gray;

            }
            /*transform -the badge is titled to the side*/
            .badge{
                font-size:28px;
                font-weight: bold;
                color:gold;
                transform:rotate(15deg);
            }
            /*typography-footer text*/
            .made-by{
                color:coral;
                font-style:italic;

            }
        </style>

    </head>
    <body>
        <h1 class="hero-name">THUNDER KID</h1>
        <p class="tagline">The most powerfull hero in the school.</p>
        <h2 class="label">SUPER POWERS</h2>
        <p class="power">Can run fater than a cheetah</p>
        <p class="power">Can lift a school bus</p>
        <h2 class="label">WEAKNESS</h2>
        <P class="weakness">Maths home work</P>
        <p class="weakness">Broclli</p>
        <p class="badge">Top Hero</p>
        <p class="made-by">Created by MAHNOOR AZHAR</p>
    </body>
</html>
