<!DOCTYPE html>
<html>
    <head>
        <title>My ice-cream shop menu</title>
        <style>
            body{
                background-color:cadetblue;
                font-family:arial , sans-serif;
                text-align:center;
                color:blueviolet;
            }
            h1{
                color:aquamarine;
                font-size:36px;
            }
            h1+p{
                color:lightcoral;
                font-weight:bold;
                background-color:beige;
                border-radius:10px;
            }
            .shop-description::first-letter{
                font-size:36px;
                color:blue;
                font-weight:bold;

            }
            .menu-box{
                width:420px;
                background-color:darkgray;
                border:3px solid darkcyan;
                border-radius:15px;
                margin:20px auto;
                padding:20px;
            }
          ul{
            padding:0;
          }
          ul>li{
            list-style:none;
            background-color:darkblue;
            color:black;
            font-size:18px;
            font-weight:bold;
            font-size:18px;
            margin:10px;
            padding:12px;
            border-radius:0px;
            border:2px solid green;

          }
          ul>li :nth-child(3){
            background-color:darkolivegreen;
            color:antiquewhite;
            border:2px solid darkslategray;

          }
          ul>li:hover{
            background-color:darkolivegreen;
            color:aquamarine;
            cursor:pointer;
            transform:scale(1.05);



          }
          button{
            background-color:palevioletred;
            color:white;
            border:none;
            border-radius:20px;
            padding:12px 24px;
            font-size:16px;
            font-weight:bold;
          }

          button:hover{
            background-color:brown

          }
            
        </style>
    </head>
    <body>
      <h1>My ice-cream shop menu</h1>
      <p>Welcome to scoops of joy!</p>
      <p class="shop-description">
        We serve colorfull,creamy and delicious ice-cream flavours.
      </p>
      <div class="menu-box">
        <h2>Todays ice-cream flavours</h2>
        <ul>
          <li>Choclate delight</li>
          <li>Strawberry swirl</li>
          <li>Vanilla dream</li>
        </ul>
        <button>Order now</button>
      </div>

    </body>
    
</html>
