<!DOCTYPE html>
<html>
    <head>
        <title>
            My animal fact file.
        </title>
        <style>
            /* page background-sets color anf font of the whole page*/
            body{
                background-color:darkgreen;
                font-family:Arial, sans-serif;
            }
            /*boxmodel-width sets the content area padding pushes the teaxt away from the edges border draws a visible frame around the fact file margin pushes the fact file away from the from the screen edge*/
.fact-file{
    background-color:lightyellow;
    color:darkslategray;
    width:260px;
    border:4px solid forestgreen;
    margin:30px;
}
/*animal name-forestgreen so it stands out*/
.animal-name{
    color:forestgreen;
    font-size:22px;
}
/*detail rows-dark text on the light background*/
.detail{
    color:darkslategray;
}
/*cool fact-orange and italic to make it feel special*/
.cool-fact{
    color:darkorange;
    font-style:italic;

}
        </style>
    </head>
    <body>
        <div class="fact-file">
            <h2 class="animal-name">Snow leoperd</h2>
            <p class="detail">Type:big cat</p>
            <p class="detail">Lives in:Mountain ranges of central asia</p>
            <p class="detail">Diet:deer,goat and wild sheeps</p>
            <p class="cool-fact">cool-fact:Can leap upto 15 meters in one jump</p>
        </div>
    </body>
</html>
