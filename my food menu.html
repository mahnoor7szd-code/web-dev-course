<!DOCTYPE html>
<html>
    <head>
        <title>My food menu</title>
        <style>
            body{
                font-family:arial;
                background:#fff8f0;
                padding:30px;
                text-align:center;
            }
            h1{
                color:#e65c00;
            }
            /* sibling selector- styles the paragraph right after h1*/
            h1+p{
                background: #ffeb02;
                padding:10px 20px;
                border-radius:8px;
                color:#bf360c;
                display:inline-block;
            }
            ul{padding:0; margin-top: 20px;}
            /* child selector-styles only direct li children of ul*/
            ul>li{
                list-style:none;
                font-size:18px;
                font-weight:bold;
                color:#5d4037;
                padding:10px 20px;
                margin:6px auto;
                width:260px;
              background:#fff3e0;
              border-radius:8px;

            }
            /* nth-child - highlights the 3rd item as chefs special*/
            ul li:nth-child(3){
                background:#ffe082;
                color:#e65c00;


            }
            .desc{
                color:#555;
                margin-top:20px;
                font-size:15px;
                max-width:400px;
                margin-left:auto;
                margin-right:auto;

            }
            /*first-letter-makes the first letter big and bold*/
            .desc::first-letter{
                font-size:220%;
                color:#e65c00;
                font-weight:bold;

            }
            .links{margin-top:25px;}
            /* hover effects - link glows when mouse moves over them*/
            a{
                color:#e65c00;
                text-decoration:none;
                font-size:150x;
                margin:0 12px;
                padding:8px 18px;
                border:2px solid #e65c00;
                border-radius: 8px;
            }
            a:hover{
                background:#e65c00;
                color:white;


            }
             
        </style>


    </head>
    <body>
        <h1>My food menu.</h1>
        <p>Pick ur favourite dish and dig in!</p>
        <ul>
            <li>pizza</li>
            <li>burger</li>
            <li>Tacos-chefs special</li>
            <li>noodles</li>
            <li>ice-cream</li>

        </ul>
        <p class="desc">Every dish on this menu is made with love and loads of flavour.Try them all and choose ur favourite.</p>
        <div class="links">
            <a href="#">order now</a>
            <a href="#">see more</a>
            </div>
            

        
    </body>
</html>
