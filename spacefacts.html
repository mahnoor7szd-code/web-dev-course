<!DOCTYPE html>
<html>
    <head>
        <title>
            Space fact file
        </title>
        <style>
            body{
                background-color:midnightblue;
                font-family:Arial,sans-serif;

            }
            .fact-file{
                background-color:lavender;
                color:darkslateblue;
                width:260px;
                padding:25px;
                border:4px solid mediumpurple;
                margin:30px;
            }
            /*planet name-purple so it stands out*/
            .planet-name{
                color:purple;
                font-size:22px;
            }
            /*Detail rows-dark text on the  light background*/
            .detail{
                color:darkslateblue;
            }
            /*cool fact-orange and italic to make it feel special*/
            .cool-fact{
                color:darkorange;
                font-style:italic;

            }

        </style>
    </head>
    <body>
        <div class="fact-file">
            <h2 class="planet-name">Mars</h2>
            <p class="detail">Type:rocky planet</p>
            <p class="detail">Distance from the sun:About 228 million km</p>
            <p class="detail">Moons:Phoobos and deimos</p>
            <p class="cool-fact">Cool-fact:Mars is known as red planet.</p>
            
            
        </div>
    </body>
</html>
