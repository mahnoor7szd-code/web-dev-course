<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            My color card
        </title>
        <style>
            /*universal selector -applies everything on the page*/ 
            * {
                font-size: 16px;
            }
            /* element selectors*/
            body {
                background-color:lightgrey;

            }
            h1{
                color:darkblue;
            }
            h2{
                color:purple;
            }
            p{
                color:dimgrey;
            }
            /* class Selector*/
            .MY-detail{
                color:darkgreen;
                font-weight:bold;
            }
            /*Id Selector*/
            #my-card{
                background-color:lightcyan;
            }

        </style>

    <body>
        <h1>My color card</h1>
        <!--inline CSS:Add style=color:________;inside this p tag-->
        <p style="color:crimson;">Hi!This is my very own web page.</p>
        <div id="my-card">
            <h2>About me</h2>
            
            <p class="my-detail">My name is Mahnoor</p>
            <p class="my-detail">My favourite color is Dark blue</p>
            <p class="my-detail">My favourite subject is physics</p>
        </div>
        <h2>My favourite things</h2>
        <p>My favourite animal is dog</p>
        <p>My favourite sport is basket ball</p>
        <p>My favourite movie is Final destination</p>


    </body>

</html>
